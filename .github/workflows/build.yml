name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q HuaweiKeyboardFix.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Assemble debug APK
        working-directory: HuaweiKeyboardFix
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: huawei-keyboard-fix-debug
          path: HuaweiKeyboardFix/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
